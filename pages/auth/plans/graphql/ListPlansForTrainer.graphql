query ListPlansByTrainer($trainerId: ID!, $limit: Int, $nextToken: String) {
  listPlansByTrainerId(trainerId: $trainerId, limit: $limit, nextToken: $nextToken) {
    items {
        id
        updated_at
        meetings
        weeks
        trainerId
        memberId
        member {
          name
        }
    }
    nextToken
  }
}