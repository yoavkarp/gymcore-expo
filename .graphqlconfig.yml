projects:
  Codegen Project:
    schemaPath: schema.json
    includes:
      - appsync/**/*.ts
    excludes:
      - ./amplify/**
      - appsync/API.ts
    extensions:
      amplify:
        codeGenTarget: typescript
        generatedFileName: appsync/API.ts
        docsFilePath: appsync
        region: eu-central-1
        apiId: jmzn3anqr5fybnowrnec2j6i3m
        frontend: javascript
        framework: react-native
        maxDepth: 2
extensions:
  amplify:
    version: 3
