projects:
  Codegen Project:
    schemaPath: schema.json
    includes:
      - appsync/graphql/**/*.ts
    excludes:
      - ./amplify/**
      - appsync/API.ts
    extensions:
      amplify:
        codeGenTarget: typescript
        generatedFileName: appsync/API.ts
        docsFilePath: appsync/graphql
        region: eu-central-1
        apiId: qothdwnyyvgufh2zh4ivltuf6i
        frontend: javascript
        framework: react-native
        maxDepth: 2
extensions:
  amplify:
    version: 3
