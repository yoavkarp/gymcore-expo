query GetMemberById($id: ID!) {
    getMemberById(memberId: $id) {
        tenantId
        id
        name
        phone_number
        email
        created_at
        gender
        birthdate
        address
        profile_workouts {
            items {
                id
                name
                created_at
                updated_at
            }
            nextToken
        }
        measurement {
            height
            weight
            fat
            heart_rate
        }
    }
}