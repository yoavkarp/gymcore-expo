mutation UpdateSetInExercise($trainerId: ID!, $workoutId: ID!, $exerciseId: ID!, $setId: ID!, $input: SetInput!) {
    updateSetInExercise(trainerId: $trainerId, workoutId: $workoutId, exerciseId: $exerciseId, setId: $setId, input: $input) {
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
        updated_at
        trainerId
    }
}