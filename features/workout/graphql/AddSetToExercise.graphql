mutation AddSetToExercise($trainerId: ID!, $workoutId: ID!, $exerciseId: ID!, $input: SetInput!) {
    addSetToExercise(trainerId: $trainerId, workoutId: $workoutId, exerciseId: $exerciseId, input: $input) {
        trainerId
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
        updated_at
    }
}