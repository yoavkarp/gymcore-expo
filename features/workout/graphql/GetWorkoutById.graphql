query GetWorkoutById($workoutId: ID!) {
    getWorkoutById(workoutId: $workoutId) {
        id
        tenantId
        clubId
        created_at
        updated_at
        trainerId
        memberId
        name
        notes
        exercises {
            ... on StrengthExercise {
                id
                xid
                name
                notes
                machine_number
                seat_height
                sets {
                    id
                    reps { ...ParameterFragment }
                    weight { ...ParameterFragment }
                    rest { ...ParameterFragment }
                }
            }
            ... on CardioExercise {
                id
                xid
                name
                notes
                machine_number
                seat_height
                intervals {
                    id
                    duration { ...ParameterFragment }
                    distance { ...ParameterFragment }
                    tempo { ...ParameterFragment }
                    intensity { ...ParameterFragment }
                    angle { ...ParameterFragment }
                    resistance { ...ParameterFragment }
                    rest { ...ParameterFragment }
                }
            }
        }
    }
}

fragment ParameterFragment on Parameter {
    max
    val
    unit
}