query GetWorkoutById($workoutId: ID!) {
    getWorkoutById(workoutId: $workoutId) {
        id
        tenantId
        clubId
        created_at
        updated_at
        trainerId
        memberId
        name
        notes
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
    }
}

fragment ParameterFragment on Parameter {
    max
    val
    unit
}