mutation AddExerciseToWorkout($id: ID!, $input: AddExerciseToWorkoutInput!) {
    addExerciseToWorkout(workoutId: $id, input: $input) {
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
        updated_at
    }
}