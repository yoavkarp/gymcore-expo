mutation DeleteExerciseFromWorkout($trainerId: ID!, $workoutId: ID!, $exerciseId: ID!) {
    deleteExerciseFromWorkout(trainerId: $trainerId, workoutId: $workoutId, exerciseId: $exerciseId) {
        id
        updated_at
        trainerId
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
    }
}