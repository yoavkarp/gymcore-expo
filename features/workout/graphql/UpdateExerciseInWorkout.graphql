mutation UpdateExerciseInWorkout($trainerId: ID!, $workoutId: ID!, $exerciseId: ID!, $input: UpdateExerciseInWorkoutInput!) {
    updateExerciseInWorkout(trainerId: $trainerId, workoutId: $workoutId, exerciseId: $exerciseId, input: $input) {
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
        updated_at
        trainerId
    }
}