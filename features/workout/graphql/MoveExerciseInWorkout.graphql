mutation MoveExerciseInWorkout($trainerId: ID!, $workoutId: ID!, $from: Int!, $to: Int!) {
    moveExerciseInWorkout(trainerId: $trainerId, workoutId: $workoutId, from: $from, to: $to) {
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
        updated_at
        trainerId
    }
}