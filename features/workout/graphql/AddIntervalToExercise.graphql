mutation AddIntervalToExercise($workoutId: ID!, $exerciseId: ID!, $input: IntervalInput!) {
    addIntervalToExercise(workoutId: $workoutId, exerciseId: $exerciseId, input: $input) {
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
        updated_at
    }
}