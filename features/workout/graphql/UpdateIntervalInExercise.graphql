mutation UpdateIntervalInExercise($trainerId: ID!, $workoutId: ID!, $exerciseId: ID!, $intervalId: ID!, $input: IntervalInput!) {
    updateIntervalInExercise(trainerId: $trainerId, workoutId: $workoutId, exerciseId: $exerciseId, intervalId: $intervalId, input: $input) {
        exercises {
            __typename
            ... on StrengthExercise {
                ...StrengthExerciseFragment
            }
            ... on CardioExercise {
                ...CardioExerciseFragment
            }
        }
        updated_at
        trainerId
    }
}